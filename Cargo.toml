[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/forge-core",
    "crates/forge-codegen",
    "crates/forge-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZDataForge Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
